<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="One Markdown file. Your knowledge, anywhere. portable.md is coming soon.">
  <meta name="theme-color" content="#101319">
  <title>portable.md is coming soon</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #101319;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header { padding: 28px clamp(24px, 6vw, 80px); }
    .brand {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.06em;
    }
    .brand span { color: #4294dd; }
    main { align-self: center; padding: 64px 24px; text-align: center; }
    h1 {
      margin: 0;
      font-size: clamp(48px, 11vw, 112px);
      font-weight: 600;
      letter-spacing: -0.065em;
      line-height: 1.08;
    }
    .description {
      margin: 28px auto 0;
      max-width: 34ch;
      color: #aeb5c2;
      font-size: clamp(17px, 2.3vw, 21px);
      line-height: 1.65;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <header><div class="brand">portable<span>.md</span></div></header>
  <main>
    <h1>Coming soon<span style="color: #4294dd;">.</span></h1>
    <p class="description">Static by design. Portable by nature.<br>Your knowledge, anywhere.</p>
  </main>
</body>
</html>
